name: Continuous Integration & Verification

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-gate:
    name: Lint, Test & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run ESLint
        run: npx eslint .

      - name: Run TypeScript Typecheck
        run: npx tsc -b

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Verify Dataset Integrity
        run: node scripts/verifyData.mjs

      - name: Compile Production Site
        run: npx vite build

  dependency-review:
    name: Supply Chain Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Dependency Review Action
        uses: actions/dependency-review-action@5a2ce3f5b92ee19cbb1541a4984b76d921601d7c # v4.3.4
        with:
          fail-on-severity: high
