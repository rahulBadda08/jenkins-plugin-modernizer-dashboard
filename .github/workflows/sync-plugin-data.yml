name: Sync Ecosystem Data

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ecosystem-sync"
  cancel-in-progress: false

jobs:
  fetch-and-sync:
    name: Ingest Ecosystem Reports & Commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      has_changes: ${{ steps.commit-step.outputs.has_changes }}
      deploy_sha: ${{ steps.commit-step.outputs.deploy_sha }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Jenkins Plugin Ecosystem Data
        run: node scripts/fetchData.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Ingested Data Integrity
        run: node scripts/verifyData.mjs

      - name: Commit Fresh Data
        id: commit-step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/all_plugins.json src/data/manifest.json
          if git diff --staged --quiet; then
            echo "No data changes detected — skipping commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): nightly autonomous refresh of jenkins ecosystem metadata"
            PUSH_SUCCESS=false
            for attempt in 1 2 3; do
              echo "Rebasing against origin/main before pushing (attempt $attempt)..."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase conflict detected. Aborting rebase attempt $attempt..."
                git rebase --abort || true
                sleep 3
                continue
              fi
              if git push origin main; then
                echo "Successfully published fresh data commit to main."
                PUSH_SUCCESS=true
                break
              fi
              echo "Push rejected by remote. Retrying in 3s..."
              sleep 3
            done
            if [ "$PUSH_SUCCESS" = "false" ]; then
              echo "Error: Failed to push commit after 3 attempts."
              exit 1
            fi
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Report Telemetry Summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("src/data/manifest.json")) {
              try {
                const manifest = JSON.parse(fs.readFileSync("src/data/manifest.json", "utf8"));
                const summary = [
                  "### 📊 Ingestion Telemetry Summary",
                  "",
                  "| Metric | Value |",
                  "|---|---|",
                  "| **Source Tree SHA** | `" + (manifest.sourceTreeSha || "unknown") + "` |",
                  "| **Discovered Plugins** | " + (manifest.discoveredCount ?? 0) + " |",
                  "| **Successfully Parsed** | " + (manifest.successfulCount ?? 0) + " |",
                  "| **Failed Downloads** | " + (manifest.failedCount ?? 0) + " |",
                  "| **Invalid Reports** | " + (manifest.invalidCount ?? 0) + " |",
                  "| **Total Migrations** | " + (manifest.totalMigrations ?? 0) + " |",
                  "| **Valid Migrations** | " + (manifest.validMigrations ?? 0) + " |",
                  "| **Success Ratio** | " + ((manifest.successRatio || 0) * 100).toFixed(2) + "% |",
                  "| **Dataset SHA-256** | `" + (manifest.datasetSha256 || "none") + "` |",
                  ""
                ].join("\n");
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
              } catch (e) {
                console.error("Failed to generate summary: " + e.message);
              }
            } else {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### ⚠️ Ingestion Failed\nManifest file was not generated.");
            }
          '

      - name: Alert on Ingestion Failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `🚨 [Pipeline Alert] Ecosystem Data Ingestion Failed (${new Date().toISOString().slice(0, 10)})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `### Automated Ingestion Failure Report\n\nThe scheduled metadata synchronization job failed or did not meet data quality criteria.\n\n- **Workflow Run**: [View Failure Logs](${runUrl})\n- **Event**: \`${context.eventName}\`\n- **Commit**: \`${context.sha}\`\n- **Date**: \`${new Date().toUTCString()}\`\n\n#### Troubleshooting Checklist\n1. Verify upstream repository availability at [jenkins-infra/metadata-plugin-modernizer](https://github.com/jenkins-infra/metadata-plugin-modernizer).\n2. Check for GitHub API / raw URL rate limits or credential expiry.\n3. Confirm that previous dataset (\`src/data/all_plugins.json\`) was preserved by the atomic rollback mechanism.`;

            try {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: ['pipeline-failure']
              });

              if (issues.data.length === 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['pipeline-failure', 'automated', 'bug']
                });
                console.log('Opened automated pipeline failure issue.');
              } else {
                console.log('An open pipeline failure issue already exists. Skipping duplicate creation.');
              }
            } catch (err) {
              console.error('Failed to dispatch alert issue: ' + err.message);
            }

  publish-updated-dashboard:
    name: Publish Updated Dashboard
    needs: fetch-and-sync
    if: needs.fetch-and-sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository at Refreshed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fetch-and-sync.outputs.deploy_sha }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run ESLint
        run: npx eslint .

      - name: Run TypeScript Typecheck
        run: npx tsc -b

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Verify Dataset Integrity
        run: node scripts/verifyData.mjs

      - name: Compile Production Site
        run: npx vite build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
