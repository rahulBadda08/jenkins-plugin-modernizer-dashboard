name: Sync Ecosystem Data

on:
  schedule:
    - cron: '0 0 * * *' # Run at Midnight UTC every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "sync-data"
  cancel-in-progress: true

jobs:
  fetch-and-sync:
    name: Ingest Ecosystem Reports & Commit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Jenkins Plugin Ecosystem Data
        run: node scripts/fetchData.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Ingestion Data Files
        run: |
          test -f src/data/all_plugins.json
          test -f src/data/manifest.json

      - name: Commit Fresh Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/all_plugins.json src/data/manifest.json
          if git diff --staged --quiet; then
            echo "No data changes detected — skipping commit."
          else
            git commit -m "chore(data): nightly autonomous refresh of jenkins ecosystem metadata"
            git push origin main
          fi
