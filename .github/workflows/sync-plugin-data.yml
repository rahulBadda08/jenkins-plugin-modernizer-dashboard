name: Sync Ecosystem Data

on:
  schedule:
    - cron: '0 0 * * *' # Run at Midnight UTC every day
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-sync:
    name: Ingest Ecosystem Reports & Commit
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit-step.outputs.has_changes }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Jenkins Plugin Ecosystem Data
        run: node scripts/fetchData.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Ingestion Data Files
        run: |
          test -f src/data/all_plugins.json
          test -f src/data/manifest.json

      - name: Commit Fresh Data
        id: commit-step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/all_plugins.json src/data/manifest.json
          if git diff --staged --quiet; then
            echo "No data changes detected — skipping commit."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): nightly autonomous refresh of jenkins ecosystem metadata"
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  publish-updated-dashboard:
    name: Publish Updated Dashboard
    needs: fetch-and-sync
    if: needs.fetch-and-sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run ESLint
        run: npx eslint .

      - name: Run TypeScript Typecheck
        run: npx tsc -b

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Compile Production Site
        run: npx vite build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
