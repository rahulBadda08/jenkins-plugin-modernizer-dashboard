name: Pull Request Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & Package PR Preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build PR Distribution
        env:
          VITE_BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
        run: npm run build

      - name: Performance Budget Verification
        run: npm run budget:check

      - name: Upload PR Preview Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.5.1
        with:
          name: pr-preview-${{ github.event.number }}
          path: dist/
          retention-days: 5

      - name: Post PR Preview Status Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = context.issue.number;
            const marker = "<!-- pr-preview-status-comment -->";
            const body = `${marker}\n### 🚀 PR Preview Package Generated\n\nThe preview bundle for PR #${prNumber} has been compiled and verified against performance budgets.\n\n- **Artifact Name**: \`pr-preview-${prNumber}\`\n- **Commit**: \`${context.sha}\`\n- **Bundle Verification**: Passed all performance budgets ✅\n\nTo run this build locally: download the artifact, extract, and serve with \`npx serve dist\`.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }

  cleanup:
    name: Cleanup Preview on PR Close
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Log Preview Cleanup
        run: |
          echo "PR ${{ github.event.pull_request.number || github.event.number }} closed. Artifacts will expire via retention policy."

