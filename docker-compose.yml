services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: jenkins-plugin-modernizer-dashboard:latest
    container_name: jenkins-modernizer-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
