services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: jenkins-plugin-modernizer-dashboard:latest
    container_name: jenkins-modernizer-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
